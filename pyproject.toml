[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clm-nemotron"
version = "0.2.0"
description = "Contrastive Language Models on NVIDIA Nemotron: fast, cheap classifiers and rankers served behind a typed-question API, trainable from a browser"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "CLM-Nemotron maintainers" },
    { name = "Jacky Kwok (upstream CLM)", email = "jackykwok@berkeley.edu" },
]
keywords = ["contrastive", "embeddings", "classification", "nemotron", "system-one", "ranking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# What clm-serve and clm-train need.  The encoder runs separately: vLLM on a Linux GPU
# ([gpu] extra) or clm-encoder on a Mac or CPU ([mac] extra).
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
    "torch>=2.1",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "transformers>=5.2",          # the encoder's tokenizer, so long texts keep their prompt
    "pyarrow>=14",                # parquet training data
    "huggingface_hub>=0.20",      # typed datasets and optional Hub downloads
]

[project.optional-dependencies]
# the 8B encoder behind vLLM (Linux + NVIDIA GPU): scripts/serve_encoder_gpu.sh
gpu = ["vllm>=0.6"]
# clm-encoder: the encoder on Apple silicon (MPS), CUDA or CPU, without vLLM
mac = ["sentence-transformers>=5.4.1"]
# tests/ (no GPU, no network)
test = ["pytest>=8", "httpx>=0.25", "pyflakes>=3"]
# research/examples/t_rex: persistent HTTP client for the real-time player
examples = ["httpx>=0.25"]

[project.scripts]
clm-serve = "clm.server:main"
clm-train = "clm.train_cli:main"
clm-download = "clm.heads:download_main"
clm-encoder = "clm.local_encoder:main"
clm-benchmark = "clm.benchmark:main"

[project.urls]
Homepage = "https://github.com/rgvvvg5mpz-collab/clm-nemotron"
"User guide" = "https://github.com/rgvvvg5mpz-collab/clm-nemotron/blob/main/docs/USER_GUIDE.md"
"Upstream CLM" = "https://github.com/Contrastive-LM/CLM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clm = ["py.typed", "static/*", "static/sample/*"]
